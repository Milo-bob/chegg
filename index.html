<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<title>CHEGG</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  @supports (height: 100dvh) { html, body { height: 100dvh; } }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    -webkit-user-select: none; user-select: none;
    image-rendering: pixelated; touch-action: none; display: block; background: #15151c;
  }
  @supports (height: 100dvh) { canvas { width: min(100vw, calc(100dvh * 16 / 9)); height: min(100dvh, calc(100vw * 9 / 16)); } }
  /* phones held upright: the board needs a wide screen */
  #rot { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0b10; color: #f1f0ee; text-align: center; padding: 24px; font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; }
  #rot .ico { font-size: 64px; animation: tilt 2.4s ease-in-out infinite; }
  #rot h2 { margin: 0; font-size: 22px; }
  #rot p { margin: 0; color: #c3c2c1; max-width: 300px; line-height: 1.4; }
  #rot button { margin-top: 8px; padding: 12px 22px; border: 0; border-bottom: 4px solid #2b2a28; border-radius: 8px; background: #454441; color: #fff; font-size: 16px; font-weight: 600; }
  @keyframes tilt { 0%, 15% { transform: rotate(0); } 55%, 85% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
  @media (orientation: portrait) and (pointer: coarse) { #rot:not(.skip) { display: flex; } }
  #dlg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.65); font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; z-index: 10; }
  #dlg.on { display: flex; }
  #dlg .card { background: #262522; color: #f1f0ee; border-radius: 10px; padding: 26px 28px; width: min(400px, 92vw); box-shadow: 0 12px 40px rgba(0,0,0,.5); max-height: 90vh; overflow: auto; }
  #dlg h2 { margin: 0 0 14px; font-size: 22px; }
  #dlg p { margin: 0 0 14px; color: #c3c2c1; line-height: 1.4; }
  #dlg input { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 11px 12px; border-radius: 6px; border: 1px solid #3d3a37; background: #1f1e1b; color: #fff; font-size: 16px; }
  #dlg input:focus { outline: 2px solid #81b64c; }
  #dlg .err { color: #ff7f75; min-height: 22px; font-size: 14px; margin: 4px 0; }
  #dlg .row { display: flex; gap: 10px; margin-top: 10px; }
  #dlg button { flex: 1; padding: 12px; border: 0; border-bottom: 4px solid #2b2a28; border-radius: 8px; background: #454441; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  #dlg button:hover { background: #55534f; }
  #dlg button.go { background: #81b64c; border-bottom-color: #45753c; }
  #dlg button.go:hover { background: #95c95d; }
  #dlg .tabs { display: flex; gap: 8px; margin-bottom: 10px; }
  #dlg .tabs button { border-bottom-width: 3px; padding: 9px; }
  #dlg .tabs button.on { background: #81b64c; border-bottom-color: #45753c; }
  #dlg table { width: 100%; border-collapse: collapse; }
  #dlg td { padding: 6px 8px; border-bottom: 1px solid #3d3a37; font-size: 15px; }
  #dlg td:first-child { color: #989795; width: 28px; }
</style>
</head>
<body>
<div id="rot"><div class="ico">📱</div><h2>Turn your phone sideways</h2><p>Chegg plays best in landscape, so the whole board fits on the screen.</p><button type="button" onclick="document.getElementById('rot').classList.add('skip')">Play anyway</button></div>
<canvas id="c" width="1600" height="900"></canvas>
<div id="dlg"></div>
<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/config.js"></script>
<script src="js/vendor/supabase.js"></script>
<script src="js/online.js"></script>
<script src="js/game.js"></script>
</body>
</html>
